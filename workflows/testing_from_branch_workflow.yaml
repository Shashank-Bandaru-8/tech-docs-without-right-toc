apiVersion: harness.io/v1
kind: Workflow
name: Testing From Branch Workflow
identifier: testing_from_branch_workflow
type: service
owner: group:account/idp_team
metadata:
  description: Repro for branch testing with new commit
spec:
  parameters:
    - title: Details
      required:
        - name
      properties:
        harness_info:
          title: Information on Adding Users to Harness
          type: "null"
          description: |
            This notice is display-only. Create should still work.
        text field:
          title: Text Field
          type: string
        name:
          type: string
  steps:
    - id: log
      name: Log
      action: debug:log
      input:
        message: ${{ parameters.name }}
