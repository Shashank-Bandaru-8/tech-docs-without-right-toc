site_name: TechDocs without right TOC
site_description: Sample documentation that folds the page table of contents into the left navigation.
repo_url: https://github.com/Shashank-Bandaru-8/tech-docs-without-right-toc
edit_uri: edit/main/docs/

docs_dir: docs

nav:
  - Home: index.md
  - Getting started:
      - Overview: getting-started/overview.md
      - Install: getting-started/install.md
      - Configuration: getting-started/configuration.md
  - Guides:
      - Authoring pages: guides/authoring.md
      - Navigation and TOC: guides/navigation.md
      - Publishing: guides/publishing.md
  - Platform:
      - Architecture: platform/architecture.md
      - Security: platform/security.md
      - Operations: platform/operations.md
  - Reference:
      - MkDocs options: reference/mkdocs.md
      - Theme feature: reference/theme.md
      - FAQ: reference/faq.md

plugins:
  - techdocs-core

theme:
  name: material
  features:
    - navigation.expand
    - toc.integrate
